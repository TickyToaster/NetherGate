[package]
name = "nxsd"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
hex = "0.4"
hmac = "0.13"
p384 = "0.14"
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
toml = "1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
